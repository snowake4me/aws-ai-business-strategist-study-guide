<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIB-C01 Flashcards</title>
<style>
:root{--ink:#14181D;--ink-2:#48525E;--ink-3:#7C8794;--paper:#FCFCFA;--panel:#fff;--rule:#DCE0E4;--rule-2:#EDEFF1;
--deep:#26426B;--deep-tint:#EEF2F8;--ok:#2C6E52;--ok-tint:#EAF3EE;--no:#A63F35;--no-tint:#FAEEEC;
--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--sans)}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px 80px}
h1{font:600 22px/1.2 var(--serif);margin:0 0 4px}.sub{font:11px/1 var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:26px;margin:14px 0;min-height:180px}
.eyebrow{font:11px/1 var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px}
.q{font:500 20px/1.4 var(--serif)}.a{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule-2);color:var(--ink-2)}
.a b{color:var(--ink)}.src{font:12px var(--mono);color:var(--ink-3);margin-top:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;cursor:pointer;border-radius:5px;padding:10px 18px;border:1px solid var(--deep);background:var(--deep);color:#fff;font-weight:500}
button.ghost{background:transparent;color:var(--deep)}button.ok{background:var(--ok);border-color:var(--ok)}button.no{background:var(--no);border-color:var(--no)}
button:disabled{opacity:.4;cursor:not-allowed}
.meter{height:3px;background:var(--rule-2);margin:10px 0 18px}.meter i{display:block;height:3px;background:var(--deep);width:0;transition:width .2s}
.stats{font:13px var(--mono);color:var(--ink-3)}
label{display:inline-flex;gap:6px;align-items:center;margin:4px 14px 4px 0;font-size:14px}
.missed{background:var(--no-tint);border-left:3px solid var(--no);padding:12px 16px;border-radius:0 5px 5px 0;margin:10px 0}
.missed .q{font-size:16px}
kbd{font:12px var(--mono);border:1px solid var(--rule);border-radius:3px;padding:1px 5px;color:var(--ink-2)}
[hidden]{display:none!important}
</style></head><body><div class="wrap">
<h1>AIB-C01 Flashcards</h1><div class="sub">26 cards · built from deck.md</div>

<div id="setup" class="card">
  <div class="eyebrow">Sections</div>
  <div id="secs"></div>
  <div class="row" style="margin-top:18px">
    <button id="start">Start (shuffled)</button>
    <button id="startOrd" class="ghost">Start (deck order)</button>
  </div>
  <p class="stats" style="margin-top:16px"><kbd>space</kbd> reveal · <kbd>1</kbd> got it · <kbd>2</kbd> missed</p>
</div>

<div id="run" hidden>
  <div class="meter"><i id="bar"></i></div>
  <div class="card">
    <div class="eyebrow" id="sec"></div>
    <div class="q" id="q"></div>
    <div class="a" id="a" hidden><div id="atext"></div><div class="src" id="src"></div></div>
  </div>
  <div class="row">
    <button id="reveal">Reveal</button>
    <button id="got" class="ok" hidden>Got it</button>
    <button id="miss" class="no" hidden>Missed</button>
  </div>
  <p class="stats" id="prog"></p>
</div>

<div id="done" hidden>
  <div class="card">
    <div class="eyebrow">Result</div>
    <div class="q" id="score"></div>
    <div id="missedList" style="margin-top:16px"></div>
    <div class="row"><button id="again" class="no" hidden>Drill the missed cards</button><button id="reset" class="ghost">Back to setup</button></div>
  </div>
</div>
</div>
<script>
const CARDS=[{"s": "Reading discipline (Theme 1)", "q": "Before committing an answer, what must you be able to name for every rejected option?", "a": "The fact in the stem that eliminates it. If you can&#x27;t, you&#x27;re choosing on tone.", "src": "themes"}, {"s": "Reading discipline (Theme 1)", "q": "Stem states a daily volume and a weekly peak. An option proposes testing a &quot;small set of typical&quot; items. Verdict?", "a": "Wrong. Small ≠ representative; typical ≠ peak. Scope-shrink distractor.", "src": "Q9"}, {"s": "Reading discipline (Theme 1)", "q": "Stem places &quot;thousands per day&quot; and &quot;years of records&quot; after a fully stated policy. What are those phrases for?", "a": "Bait. Volume and history are enablers of ML, not needs for it.", "src": "Q13"}, {"s": "Reading discipline (Theme 1)", "q": "Stem gives a retraining cadence (&quot;every two months&quot;). Any per-request option that touches the model is...?", "a": "Wrong by construction. Parameters change only in training.", "src": "Q18"}, {"s": "Rules / RAG / agent boundary (Theme 2)", "q": "Process already runs on one AI platform; moving to Bedrock. Pilot or load test?", "a": "Representative-volume test against the current baseline. Pilot is for new capabilities, not migrations.", "src": "Q9`, skill 2.1.5"}, {"s": "Rules / RAG / agent boundary (Theme 2)", "q": "The stem spells out thresholds, fixed percentages, and a named exception. AI or rules?", "a": "Rules. Nothing is left to learn.", "src": "Q13`, skills 1.2.1 / 2.1.4"}, {"s": "Rules / RAG / agent boundary (Theme 2)", "q": "One question that decides rules vs AI?", "a": "Can the output be fully written as rules from what the stem gives you?", "src": "Q13"}, {"s": "Rules / RAG / agent boundary (Theme 2)", "q": "Stem says &quot;choose the next step, depending on the case, based on the result of a previous action,&quot; and lists actions on external systems. Solution?", "a": "AI agent with tools.", "src": "Q65`, skill 1.2.2"}, {"s": "Rules / RAG / agent boundary (Theme 2)", "q": "One question that decides workflow vs agent?", "a": "Can every path be enumerated before the first request arrives? Yes → workflow. No → agent.", "src": "Q65"}, {"s": "Rules / RAG / agent boundary (Theme 2)", "q": "Assistant that answers questions grounded in company documents, changes no external state. Agent?", "a": "No. RAG assistant. Agents act.", "src": "Q65"}, {"s": "Rules / RAG / agent boundary (Theme 2)", "q": "The four rungs of the capability ladder, bottom to top?", "a": "Rules/workflow → chatbot → RAG assistant → agent with tools.", "src": "Q65"}, {"s": "GenAI levers (Theme 3)", "q": "App works on small inputs, loses details on large ones. Cause? Lever?", "a": "Input exceeds the context window. Send less, chosen by relevance.", "src": "Q51`, skill 1.3.2"}, {"s": "GenAI levers (Theme 3)", "q": "Generated report stops before all sections are written. Lever?", "a": "Raise maximum output tokens.", "src": "Q51"}, {"s": "GenAI levers (Theme 3)", "q": "Does raising temperature or top-p change how much fits in or comes out?", "a": "No. They change which tokens are chosen, never capacity.", "src": "Q51"}, {"s": "GenAI levers (Theme 3)", "q": "&quot;Include the full history and every document&quot; as a fix for missing details. Verdict?", "a": "Makes it worse once the window is full. The model is already dropping content.", "src": "Q51"}, {"s": "GenAI levers (Theme 3)", "q": "Model lacks facts it was never trained on vs model has facts but wrong style or format. Levers?", "a": "RAG for missing facts. Fine-tuning for style, format, domain tone.", "src": "skill 1.3.3"}, {"s": "Training vs inference", "q": "Each morning the deployed model receives new data and returns a forecast. Which stage?", "a": "Inference. Nothing in the model changes.", "src": "Q18`, skill 1.1.1"}, {"s": "Training vs inference", "q": "Where do model parameters change?", "a": "Training and retraining only.", "src": "Q18"}, {"s": "Training vs inference", "q": "&quot;Uses each prediction as new training data.&quot; Verdict?", "a": "Wrong. A prediction is an output, not a training example, and updates need a separate training job.", "src": "Q18"}, {"s": "Business-value KPIs", "q": "Stem asks for KPIs capturing financial impact AND workforce efficiency. Which metric classes count?", "a": "Financial outcome, and labor-per-output or output-per-labor. Nothing else.", "src": "Q10`, skill 2.2.1"}, {"s": "Business-value KPIs", "q": "&quot;Percentage of alerts reviewed by technicians&quot; — which class?", "a": "Adoption/activity. Leading indicator at best. Not value.", "src": "Q10"}, {"s": "Business-value KPIs", "q": "Precision, inference latency, system availability, percentage of equipment connected — which class?", "a": "Technical or deployment metrics. Not business value.", "src": "Q10"}, {"s": "Business-value KPIs", "q": "Four KPI classes?", "a": "Financial outcome · workforce/process efficiency · adoption/activity · technical/model quality. Only the first two answer &quot;business value.&quot;", "src": "Q10"}, {"s": "Migration and cost planning", "q": "Two things every pre-cutover plan for an AI platform migration includes?", "a": "Cost estimate including the parallel-run period (Pricing Calculator), and a representative-volume test against the current baseline.", "src": "Q9"}, {"s": "Migration and cost planning", "q": "Pricing Calculator vs Cost Explorer?", "a": "Calculator forecasts before spend. Explorer analyzes after.", "src": "in-scope services"}, {"s": "Migration and cost planning", "q": "Consumption-based, instance-based, seat-based — which in-scope service is the canonical example of each?", "a": "Bedrock (tokens) · SageMaker AI (compute hours) · Amazon Quick (per user per month).", "src": "exam guide pricing structures"}], SECTIONS=["Reading discipline (Theme 1)", "Rules / RAG / agent boundary (Theme 2)", "GenAI levers (Theme 3)", "Training vs inference", "Business-value KPIs", "Migration and cost planning"];
const $=id=>document.getElementById(id);
let deck=[],i=0,got=0,missed=[],revealed=false;
SECTIONS.forEach((s,k)=>{const l=document.createElement('label');l.innerHTML=`<input type="checkbox" checked data-s="${k}"> ${s} <span class="stats">(${CARDS.filter(c=>c.s===s).length})</span>`;$('secs').appendChild(l);});
function chosen(){const on=[...document.querySelectorAll('#secs input')].filter(x=>x.checked).map(x=>SECTIONS[x.dataset.s]);return CARDS.filter(c=>on.includes(c.s));}
function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]];}return a;}
function begin(cards){deck=cards;i=0;got=0;missed=[];$('setup').hidden=true;$('done').hidden=true;$('run').hidden=false;show();}
function show(){if(i>=deck.length)return finish();const c=deck[i];revealed=false;$('sec').textContent=c.s;$('q').innerHTML=c.q;$('atext').innerHTML=c.a;$('src').textContent=c.src;$('a').hidden=true;$('reveal').hidden=false;$('got').hidden=true;$('miss').hidden=true;$('bar').style.width=(100*i/deck.length)+'%';$('prog').textContent=`${i+1} / ${deck.length} · got ${got} · missed ${missed.length}`;}
function reveal(){if(revealed)return;revealed=true;$('a').hidden=false;$('reveal').hidden=true;$('got').hidden=false;$('miss').hidden=false;}
function mark(ok){if(!revealed)return;if(ok)got++;else missed.push(deck[i]);i++;show();}
function finish(){$('run').hidden=true;$('done').hidden=false;$('score').textContent=`${got} / ${deck.length} got it`;const L=$('missedList');L.innerHTML='';missed.forEach(c=>{const d=document.createElement('div');d.className='missed';d.innerHTML=`<div class="q">${c.q}</div><div class="a" style="margin-top:8px;padding-top:8px">${c.a}</div><div class="src">${c.src}</div>`;L.appendChild(d);});$('again').hidden=missed.length===0;}
$('start').onclick=()=>begin(shuffle(chosen()));$('startOrd').onclick=()=>begin(chosen());
$('reveal').onclick=reveal;$('got').onclick=()=>mark(true);$('miss').onclick=()=>mark(false);
$('again').onclick=()=>begin(shuffle(missed.slice()));$('reset').onclick=()=>{$('done').hidden=true;$('setup').hidden=false;};
document.addEventListener('keydown',e=>{if($('run').hidden)return;if(e.key===' '){e.preventDefault();reveal();}else if(e.key==='1')mark(true);else if(e.key==='2')mark(false);});
</script></body></html>
